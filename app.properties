# LLM API endpoint (OpenAI-compatible). DeepSeek: https://api.deepseek.com
base_url=https://api.deepseek.com

# Your API key (https://platform.deepseek.com/api_keys)
# Can be overridden by env vars: LLM_API_KEY or DEEPSEEK_API_KEY
api_key=

# Model name, e.g. deepseek-v4-flash, deepseek-v4-pro, gpt-4o, ...
model=deepseek-v4-flash

# Optional settings:
# temperature — 0 стабилизирует вывод (дефолт API = 1)
temperature=0
# top_p — «ядерное» сэмплирование; 0.01 ≈ почти жадный выбор, стабилизирует вывод
top_p=0.01
# thinking=enabled|disabled — режим размышлений модели (DeepSeek); disabled стабильнее
thinking=disabled
max_tokens=4096
timeout_seconds=120

# Additional keys (commented out by default; also available as CLI options):
#presence_penalty=0.0
#frequency_penalty=0.0
#stop=END|END-OF-ANSWER   # до 16 последовательностей через |; API обрывает генерацию на совпадении
