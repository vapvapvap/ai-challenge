# LLM API endpoint (OpenAI-compatible). DeepSeek: https://api.deepseek.com
base_url=https://api.deepseek.com

# Your API key (https://platform.deepseek.com/api_keys)
# Can be overridden by env vars: LLM_API_KEY or DEEPSEEK_API_KEY
api_key=

# Model name, e.g. deepseek-v4-flash, deepseek-v4-pro, gpt-4o, ...
model=deepseek-v4-flash

# Optional settings:
temperature=1.0
max_tokens=4096
timeout_seconds=120
